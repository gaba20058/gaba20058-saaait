<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthApp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для переключения страниц */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Хедер (одинаковый для всех страниц) -->
    <header class="header">
        <div class="header-container">
            <div class="logo" onclick="showPage('home')" style="cursor: pointer;">
                <h1>Auth<span>App</span></h1>
            </div>
            
            <!-- Кнопки для неавторизованных -->
            <div class="auth-buttons" id="auth-buttons">
                <button class="btn btn-outline" onclick="showPage('login')">Вход</button>
                <button class="btn btn-primary" onclick="showPage('register')">Регистрация</button>
            </div>
            
            <!-- Меню авторизованного пользователя -->
            <div class="user-menu" id="user-menu" style="display: none;">
                <span class="user-name" id="user-name"></span>
                <button class="btn btn-outline" onclick="logout()">Выход</button>
            </div>
        </div>
    </header>

    <!-- Главная страница -->
    <div id="home-page" class="page active">
        <main class="main-content">
            <div class="container">
                <div class="hero">
                    <h1>Добро пожаловать в AuthApp</h1>
                    <p>Простая и безопасная аутентификация для ваших проектов</p>
                    <div class="hero-buttons">
                        <button class="btn btn-primary btn-large" onclick="showPage('register')">Начать сейчас</button>
                        <button class="btn btn-outline btn-large" onclick="showPage('login')">Войти</button>
                    </div>
                </div>
                
                <div class="features">
                    <div class="feature-card">
                        <div class="feature-icon">🔐</div>
                        <h3>Безопасность</h3>
                        <p>JWT токены и bcrypt хеширование паролей</p>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">⚡</div>
                        <h3>Быстрота</h3>
                        <p>Мгновенная аутентификация</p>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">📱</div>
                        <h3>Адаптивность</h3>
                        <p>Работает на всех устройствах</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Страница регистрации -->
    <div id="register-page" class="page">
        <main class="main-content">
            <div class="container">
                <div class="form-container">
                    <h2>Регистрация</h2>
                    
                    <form id="registerForm" onsubmit="event.preventDefault(); register()">
                        <div class="form-group">
                            <label for="reg-username">Имя пользователя</label>
                            <input 
                                type="text" 
                                id="reg-username" 
                                placeholder="Введите имя (только русские буквы)" 
                                required 
                                pattern="^[А-Яа-яЁё]+$"
                                title="Только кириллица"
                            >
                            <div class="error-message" id="username-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input 
                                type="email" 
                                id="reg-email" 
                                placeholder="Введите email" 
                                required
                            >
                            <div class="error-message" id="email-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="reg-password">Пароль</label>
                            <input 
                                type="password" 
                                id="reg-password" 
                                placeholder="Минимум 6 символов" 
                                required
                                minlength="6"
                            >
                            <div class="error-message" id="password-error"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                    </form>

                    <p class="form-footer">
                        Уже есть аккаунт? 
                        <button class="link-button" onclick="showPage('login')">Войти</button>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <!-- Страница входа -->
    <div id="login-page" class="page">
        <main class="main-content">
            <div class="container">
                <div class="form-container">
                    <h2>Вход в аккаунт</h2>
                    
                    <form id="loginForm" onsubmit="event.preventDefault(); login()">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input 
                                type="email" 
                                id="login-email" 
                                placeholder="Введите email" 
                                required
                            >
                            <div class="error-message" id="login-email-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="login-password">Пароль</label>
                            <input 
                                type="password" 
                                id="login-password" 
                                placeholder="Введите пароль" 
                                required
                            >
                            <div class="error-message" id="login-password-error"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Войти</button>
                    </form>

                    <p class="form-footer">
                        Нет аккаунта? 
                        <button class="link-button" onclick="showPage('register')">Зарегистрироваться</button>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <!-- Сообщения -->
    <div id="message" class="message"></div>

    <script src="main.js"></script>
    <script>
        // Функция переключения страниц
        function showPage(pageName) {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Показываем нужную страницу
            document.getElementById(pageName + '-page').classList.add('active');
            
            // Обновляем активную кнопку в хедере
            updateHeaderButtons(pageName);
        }

        // Обновление кнопок в хедере
        function updateHeaderButtons(activePage) {
            const loginBtn = document.querySelector('.auth-buttons .btn-outline');
            const registerBtn = document.querySelector('.auth-buttons .btn-primary');
            
            if (activePage === 'login') {
                loginBtn.className = 'btn btn-primary';
                registerBtn.className = 'btn btn-outline';
            } else if (activePage === 'register') {
                loginBtn.className = 'btn btn-outline';
                registerBtn.className = 'btn btn-primary';
            } else {
                loginBtn.className = 'btn btn-outline';
                registerBtn.className = 'btn btn-primary';
            }
        }

        // Показываем главную страницу при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            showPage('home');
        });
    </script>
</body>
</html>
